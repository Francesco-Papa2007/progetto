<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Dati Personali</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
            background: #f7f7f7;
            font-family: Arial, Helvetica, sans-serif;
        }
        form {
            width: min(520px, 90%);
            padding: 26px 28px;
            border-radius: 16px;
            background: rgb(229, 226, 226);
            box-shadow: 0 12px 30px rgba(27, 64, 44, 0.08);
        }
        h1 {
            text-align: center;  
            margin-bottom: 24px;
            font-size: 1.95rem;
        }
        div {
            display: grid;
            gap: 8px;
            margin-bottom: 18px;
        }
        label {
            font-weight: 600;
            font-size: 1rem;
        }
        input {
            width: 100%;
            padding: 12px 14px;
            font-size: 1rem;
            border: 1px solid #c1c1c1;
            border-radius: 8px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 14px 16px;
            font-size: 1.05rem;
            border: none;
            border-radius: 10px;
            background: #0066cc;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background: #0055a3;
        }
        .errore {
            color: #b00020;
            font-size: 0.92rem;
            min-height: 1.2em;
        }
    </style>

</head>
<body>

    <h1>Dati Personali</h1>

    <form id="formPagina1">

        <div>
            <label>Nome</label>
            <input type="text" id="nome" required>
            <span class="errore" id="errNome"></span>
        </div>

        <div>
            <label>Cognome</label>
            <input type="text" id="cognome" required>
            <span class="errore" id="errCognome"></span>
        </div>

        <div>
            <label>Email</label>
            <input type="email" id="email" required>
            <span class="errore" id="errEmail"></span>
        </div>

        <div>
            <label>Telefono</label>
            <input type="text" id="telefono" required>
            <span class="errore" id="errTelefono"></span>
        </div>

        <button type="button" id="btnAvanti" onclick="validateForm()">
            Avanti
        </button>

    </form>
    <script>
        function validateForm() {
            var nome = document.getElementById("nome").value;
            var cognome = document.getElementById("cognome").value;
            var email = document.getElementById("email").value;
            var telefono = document.getElementById("telefono").value;

            var errNome = document.getElementById("errNome");
            var errCognome = document.getElementById("errCognome");
            var errEmail = document.getElementById("errEmail");
            var errTelefono = document.getElementById("errTelefono");


            var oggetto = { 
                    nome, cognome, email, telefono
            }

            var isValid = true;

            if (nome === "") {
                errNome.innerHTML = "Il nome è obbligatorio.";
                isValid = false;
            } else {
                errNome.innerHTML = "";
            }
            if (cognome === "") {
                errCognome.innerHTML = "Il cognome è obbligatorio.";
                isValid = false;
            } else {
                errCognome.innerHTML = "";
            }
            if (email === "") {
                errEmail.innerHTML = "L'email è obbligatoria.";
                isValid = false;
            } else {
                errEmail.innerHTML = "";
            }
            if (telefono === "") {
                errTelefono.innerHTML = "Il telefono è obbligatorio.";
                isValid = false;
            } else {
                errTelefono.innerHTML = "";
            }

            if (isValid) {
                
                window.location.href = 'pagina2.html';
            }
        };
    
        
        function SalvaVariabili(oggetto){
            localStorage.setItem(
        "oggetto",
        oggetto
    );
        }
        
    </script>
        
</body>
</html>
